services:
  postgres:
    image: postgres:16-alpine
    container_name: polink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polink_db}
      POSTGRES_USER: ${POSTGRES_USER:-polink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polink_local_dev_pwd_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - polink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polink_user} -d ${POSTGRES_DB:-polink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: polink-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  polink_pgdata:
